version: '3.8'

services:
  csv-sync-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csv-sync-server
    ports:
      - "8000:8000"
    volumes:
      - csv_uploads:/app/uploads
    environment:
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  csv_uploads:
    driver: local
